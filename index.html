<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>John Gabriel - Links</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <style>
        body {
            background-color: #121212;
            min-height: 100vh;
        }
        .profile-img {
            width: 140px;
            height: 140px;
            object-fit: cover;
            transition: transform 0.3s ease;
        }
        .profile-img:hover {
            transform: scale(1.05);
        }
        .link-button {
            max-width: 350px;
            transition: all 0.2s ease-in-out;
        }
        .link-button:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 20px rgba(255, 255, 255, 0.1) !important;
        }
    </style>
</head>
<body class="d-flex flex-column align-items-center justify-content-center py-5 text-white">

    <div class="container text-center d-flex flex-column align-items-center">
        
        <img src="https://github.com/glzzjhn-byte.png" alt="John Gabriel" class="profile-img rounded-circle border border-3 border-light shadow-lg mb-4">
        
        <h2 class="fw-bold mb-1">John Gabriel</h2>
        
        <p class="text-secondary fs-6 fst-italic mb-4 px-3">
            "Hello guys! Thank you for Visiting my links!🙂"
        </p>

        <div class="w-100 d-flex flex-column align-items-center gap-3 mt-2">
            
            <a href="https://github.com/glzzjhn-byte" target="_blank" class="link-button btn btn-light btn-lg w-100 rounded-pill shadow fw-bold">
                <i class="bi bi-github me-2"></i> GitHub Profile
            </a>
            
            <a href="mailto:Glzzjhn@gmail.com" class="link-button btn btn-outline-light btn-lg w-100 rounded-pill shadow fw-bold">
                <i class="bi bi-envelope me-2"></i> Get in Touch
            </a>
            
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
