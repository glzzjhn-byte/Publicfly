<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

                <i class="bi bi-envelope me-2"></i> Get in Touch

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="background.js"></script>

</html>
